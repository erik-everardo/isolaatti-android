plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.0'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.isolaatti'
    compileSdk 35
    viewBinding {
        enabled = true
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId "com.isolaatti"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "0.8-vc8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.53.1"
    ksp "com.google.dagger:hilt-compiler:2.53.1"


    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'


    // Material 3
    implementation "com.google.android.material:material:1.12.0"

    // Navigation
    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // Splash screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Data security
    implementation "androidx.security:security-crypto:1.0.0"

    // Markwon
    final def markwon_version = '4.6.2'

    // Customtabs
    implementation 'androidx.browser:browser:1.8.0'

    // Coil
    implementation 'io.coil-kt.coil3:coil:3.0.4'
    implementation 'io.coil-kt.coil3:coil-svg:3.0.4'
    implementation "io.coil-kt.coil3:coil-compose:3.0.1"
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.1")


    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:editor:$markwon_version"
    implementation "io.noties.markwon:linkify:$markwon_version"
    implementation "io.noties.markwon:image-coil:$markwon_version"



    implementation ('io.socket:socket.io-client:2.1.0') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    ksp("androidx.room:room-compiler:$room_version")
    implementation "androidx.room:room-ktx:$room_version"

    // Image viewer
    implementation 'com.github.MikeOrtiz:TouchImageView:3.5'

    // Media 3
    implementation 'androidx.media3:media3-session:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation "androidx.media3:media3-ui:1.2.0"

    // QR
    implementation 'com.github.androidmads:QRGenerator:1.0.1'

    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:33.13.0"))
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")

    // OSS screen
    implementation 'com.google.android.gms:play-services-oss-licenses:17.1.0'

    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation 'androidx.compose.runtime:runtime-livedata'

    implementation("com.google.accompanist:accompanist-permissions:0.36.0")

    implementation "androidx.work:work-runtime-ktx:2.10.0"
}